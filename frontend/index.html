<header class="top">
  <button class="iconbtn menu" data-action="toggle-nav" aria-label="Open navigation"><svg class="i"><use href="#i-menu"/></svg></button>

    <svg class="i caret"><use href="#i-down"/></svg>
  </label>

  </div>
  <div class="user"><div class="av">AC</div><div class="user-t">Alex Chen<small>SRE Lead</small></div></div>
</header>
